name: touchgrass
description: "Help users spend less time online and more time exploring the real world."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # ── State management ──────────────────────────────────────────────────────────
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # ── Navigation ────────────────────────────────────────────────────────────────
  go_router: ^14.0.0

  # ── Firebase ──────────────────────────────────────────────────────────────────
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  firebase_storage: ^12.0.0
  firebase_analytics: ^11.0.0
  firebase_crashlytics: ^4.0.0
  firebase_messaging: ^15.0.0
  firebase_performance: ^0.10.0

  # ── Authentication providers ──────────────────────────────────────────────────
  google_sign_in: ^6.2.0
  sign_in_with_apple: ^6.1.0

  # ── UI & typography ───────────────────────────────────────────────────────────
  google_fonts: ^6.0.0
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  lottie: ^3.0.0

  # ── Camera & media ────────────────────────────────────────────────────────────
  image_picker: ^1.0.7
  camera: ^0.10.5
  image: ^4.9.1

  # ── Maps ──────────────────────────────────────────────────────────────────────
  google_maps_flutter: ^2.5.0
  geolocator: ^13.0.0
  geocoding: ^3.0.0

  # ── AI ────────────────────────────────────────────────────────────────────────
  google_generative_ai: ^0.4.0

  # ── Animations ────────────────────────────────────────────────────────────────
  confetti: ^0.7.0

  # ── Utilities ─────────────────────────────────────────────────────────────────
  intl: ^0.19.0
  shared_preferences: ^2.2.3
  path_provider: ^2.1.2
  permission_handler: ^11.3.0
  http: ^1.2.0
  connectivity_plus: ^6.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^2.4.0
  build_runner: ^2.4.8
  mockito: ^5.4.4
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

# ── App Icon Configuration ────────────────────────────────────────────────────
# Place your 1024×1024 icon at assets/icon/icon.png (no transparency),
# and a foreground layer at assets/icon/icon_foreground.png (safe zone: 66%).
# Then run: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: ic_launcher
  ios: true
  image_path: assets/icon/icon.png
  min_sdk_android: 21
  remove_alpha_ios: true
  adaptive_icon_background: "#2D6A4F"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  web:
    generate: false
